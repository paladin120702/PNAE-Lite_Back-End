# ============================================================
# PNAE Lite - Configuracao do Backend (Spring Boot)
# ============================================================

spring.application.name=pnae-lite-backend
server.port=8080

# ------------------------------------------------------------
# Banco de Dados H2 (em memoria)
# ------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:pnaedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ------------------------------------------------------------
# Console do H2 -> http://localhost:8080/h2-console
# JDBC URL: jdbc:h2:mem:pnaedb  | User: sa | Password: (vazio)
# ------------------------------------------------------------
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ------------------------------------------------------------
# JPA / Hibernate
# ------------------------------------------------------------
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Os dados de exemplo sao carregados via com.pnaelite.shared.config.DataSeeder (JPA).
